spring:
  application:
    name: algomate-backend
  datasource:
    # WAL + busy_timeout 让 SQLite 在多连接下支持并发读、写等待而不是立刻报锁错误
    url: "jdbc:sqlite:./backend/data/algorithm-learning.db?journal_mode=WAL&busy_timeout=5000"
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 5
      connection-init-sql: PRAGMA foreign_keys=ON
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8898

agent:
  service:
    base-url: ${AGENT_SERVICE_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
