name: algomate

services:
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}"
    command:
      - sh
      - -c
      - 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"'
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  agent-service:
    build:
      context: .
      dockerfile: agent-service/Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      USER_MEMORY_DIR: /app/agent-service/data/user-memory
      MILVUS_URI: /app/rag-data/vector/algomate-milvus.db
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: "${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}"
      MODEL_CONFIG_ENCRYPTION_KEY: "${MODEL_CONFIG_ENCRYPTION_KEY:?请在 .env 中设置 MODEL_CONFIG_ENCRYPTION_KEY}"
    volumes:
      - agent-memory:/app/agent-service/data
      - ./rag-data:/app/rag-data
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      AGENT_SERVICE_URL: http://agent-service:8000
      SPRING_DATASOURCE_URL: "jdbc:sqlite:/app/data/algorithm-learning.db?journal_mode=WAL&busy_timeout=5000"
    volumes:
      - backend-data:/app/data
    expose:
      - "8898"
    depends_on:
      agent-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8898/actuator/health
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${ALGOMATE_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  agent-memory:
  backend-data:
  redis-data:
